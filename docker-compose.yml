services:
  arangodb:
    image: arangodb/arangodb:3.12.4
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD:-openSesame}
    ports:
      - "8529:8529"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- --header \"Authorization: Basic $$(echo -n root:$$ARANGO_ROOT_PASSWORD | base64)\" http://127.0.0.1:8529/_api/version"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - arangodb-data:/var/lib/arangodb3
volumes:
  arangodb-data:
